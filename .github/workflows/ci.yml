name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  bidsentry-tests:
    name: BidSentry-E Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python bytecode compilation check
        run: python -m compileall -q app tests engine.py scripts

      - name: Run test suite
        run: python -m pytest -q

      - name: Run verification script
        run: python scripts/verify_package.py

  equilibrium-build:
    name: Equilibrium Landing Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: equilibrium-landing/package-lock.json

      - name: Install dependencies
        working-directory: equilibrium-landing
        run: npm ci

      - name: Build and typecheck
        working-directory: equilibrium-landing
        run: npm run build
