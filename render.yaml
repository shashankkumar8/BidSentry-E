services:
  - type: web
    name: bidsentry-e
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: TINYFISH_API_KEY
        sync: false
      - key: BIDSENTRY_DB_PATH
        value: /tmp/bidsentry.db
